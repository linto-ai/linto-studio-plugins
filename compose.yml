services:
  #---------- optional services
  # Convenient rapid mosquitto and posgres startup configuration
  # You will need to configure it depending on your need for custom deployments
  broker:
    image: eclipse-mosquitto:latest
    expose:
      - "${BROKER_PORT}"
    command: mosquitto -c /mosquitto-no-auth.conf
    networks:
      - internal

  database:
    image: postgres:latest
    expose:
      - "${DB_PORT}"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    command: -p ${DB_PORT}
    networks:
      - internal
  #----------

  migration:
    build:
      context: .
      dockerfile: migration/Dockerfile
    env_file:
      - .envdefault.docker
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
    depends_on:
      - database
    networks:
      - internal

  transcriber:
    build:
      context: .
      dockerfile: Transcriber/Dockerfile
    env_file:
      - .envdefault.docker
      - path: .env
        required: false
    environment:
      - DEBUG=transcriber:*
    depends_on:
      - broker
    ports:
      - "${STREAMING_PROXY_SRT_UDP_PORT}:${STREAMING_SRT_UDP_PORT}/udp"
      - "${STREAMING_PROXY_RTMP_TCP_PORT}:${STREAMING_RTMP_TCP_PORT}"
      - "${STREAMING_PROXY_WS_TCP_PORT}:${STREAMING_WS_TCP_PORT}"
    networks:
      - internal

  sessionapi:
    build:
      context: .
      dockerfile: Session-API/Dockerfile
    env_file:
      - .envdefault.docker
      - path: .env
        required: false
    environment:
      - DEBUG=session-api:*
    expose:
      - "${SESSION_API_WEBSERVER_HTTP_PORT}"
    ports:
      - "${SESSION_API_WEBSERVER_HTTP_PORT}:${SESSION_API_WEBSERVER_HTTP_PORT}"
    depends_on:
      broker:
        condition: service_started
      migration:
        condition: service_completed_successfully
    networks:
      - internal

  scheduler:
    build:
      context: .
      dockerfile: Scheduler/Dockerfile
    env_file:
      - .envdefault.docker
      - path: .env
        required: false
    environment:
      - DEBUG=scheduler:*
    depends_on:
      broker:
        condition: service_started
      migration:
        condition: service_completed_successfully
    networks:
      - internal

  botservice:
    build:
      context: .
      dockerfile: BotService/Dockerfile
    env_file:
      - .envdefault.docker
      - path: .env
        required: false
    environment:
      - DEBUG=botservice:*
      # BOT_CAPABILITIES is a name SHARED with visiobotservice below, and both read
      # the same env_file — so it is scoped per service here, never set globally.
      # Keep in sync with Bot.KNOWN_BOT_TYPES (BotService/bot/index.js).
      - BOT_CAPABILITIES=jitsi,bigbluebutton,teams,visio
    depends_on:
      broker:
        condition: service_started
    networks:
      - internal

  # Native LiveKit transcription bot (Python). Same broker contract as botservice
  # above — it registers on botservice/out/<uniqueId>/status and is routed by the
  # Scheduler on its own capability — but it joins the SFU directly instead of
  # driving a Chromium page.
  visiobotservice:
    build:
      context: .
      dockerfile: VisioBotService/Dockerfile
    env_file:
      - .envdefault.docker
      - path: .env
        required: false
    environment:
      # The native capability, scoped to this service (see botservice above).
      - BOT_CAPABILITIES=visio-native
    depends_on:
      broker:
        condition: service_started
    networks:
      - internal

networks:
  internal:
